<title>Hair Physics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: a full-bleed 3D viewport (the "chair") with one control dock along the bottom edge and a stats chip top-left. Single dark studio look by choice. */
  :root {
    --charcoal: #1b1714;
    --panel: rgba(34, 29, 26, 0.92);
    --chalk: #edeae3;
    --muted: #a39d93;
    --brass: #a6803c;
    --brass-bright: #c99a48;
    --line: rgba(237, 234, 227, 0.14);
    --font-ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--charcoal); color: var(--chalk); font-family: var(--font-ui); overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  #viewport canvas { display: block; touch-action: none; }
  #stats {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px;
    font: 500 12px/1.5 var(--font-data); color: var(--chalk);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
    font-variant-numeric: tabular-nums; max-width: calc(100% - 32px);
  }
  #stats b { color: var(--brass-bright); font-weight: 500; }
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); min-width: 52px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button, .btn {
    font: 600 15px/1 var(--font-ui); color: var(--chalk); background: transparent; border: 0;
    padding: 9px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--brass); color: #2c1f0e; }
  .btn { border: 1px solid var(--line); border-radius: 6px; }
  .btn:active { background: var(--line); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
  input[type="range"] { flex: 1 1 120px; min-width: 0; accent-color: var(--brass); }
  input[type="color"] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: transparent; padding: 2px; }
  #hint { font-size: 13px; color: var(--muted); }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// Hair physics proof of concept for the barbershop app's 3D designer.
//
// Guide strands live in float textures, one row per strand. The state
// texture is 2V wide: columns 0..V-1 hold each vertex's position, V..2V-1
// its previous position (for Verlet). Everything is simulated on the GPU
// with fragment-shader passes:
//   integrate   Verlet step: gravity, wind, damping, global shape memory
//   constrain   follow-the-leader (Müller et al. 2012): every segment keeps
//               its rest length, walked out from the pinned root, with local
//               shape memory, collisions (head, neck, shoulders) and
//               friction. Also writes the previous positions with the
//               paper's velocity correction, without which strands whip.
// Each guide is drawn as several child strands (clumped, optionally
// curled) in the vertex shader, straight from the simulation texture.
// Scissors are GPU-only too: a pass finds where the swipe crosses each
// strand, another resamples cut strands to their new length.
// Units: 1 = 10 cm. The head is an ellipsoid at the origin.

const V = 24; // vertices per strand
const CHILDREN = 8; // rendered strands per guide
const SUBSTEPS = 2;
const DT = 1 / 120;
const GRAVITY = -98; // 9.8 m/s² in 10 cm units
const HEAD_SCALE = new THREE.Vector3(0.85, 1, 0.9);
const MAX_POLAR = (130 * Math.PI) / 180;
const TORSO_CENTER = new THREE.Vector3(0, -2.75, -0.05);
const TORSO_SCALE = new THREE.Vector3(2.1, 1.05, 0.95);
const NECK_PIVOT = new THREE.Vector3(0, -0.85, -0.05);

// Per style: lengths (units), how much hair lifts off the scalp, how strongly
// it holds its shape (local = direction memory, global = position memory,
// each from root to tip), curl, and how the front is combed.
const STYLES = {
  long: { top: 3.4, sides: 3.6, back: 4.2, lift: 0.12, bend: 3.2, local: [0.6, 0.03], global: [0.12, 0.0], curl: 0, part: 0.0, sweepBack: 0.9 },
  medium: { top: 1.35, sides: 0.9, back: 1.05, lift: 0.3, bend: 2.2, local: [0.55, 0.12], global: [0.08, 0.0], curl: 0, part: 0.28, sweepBack: 0.7 },
  curly: { top: 1.7, sides: 1.4, back: 1.5, lift: 0.45, bend: 0.9, local: [0.7, 0.3], global: [0.12, 0.02], curl: 1, part: 0.0, sweepBack: 0.3 },
  crop: { top: 0.5, sides: 0.13, back: 0.15, lift: 0.22, bend: 0.5, local: [0.9, 0.6], global: [0.4, 0.2], curl: 0, part: 0.0, sweepBack: -0.4 },
};

let renderer, scene, camera, headGroup, hairMesh, hairMaterial;
let quadScene, quadCamera, quadMesh;
let guideCount = 3000;
let styleName = 'long';
let floatTargets = true;
let targets = {};
let passes = {};
let restInitialTexture;
let mode = 'orbit';
let wind = 0;
let simTime = 0;
let lastDisturbance = performance.now();
let settleFrames = 0;
const head = { yaw: 0, pitch: 0, roll: 0, matrix: new THREE.Matrix4(), inverse: new THREE.Matrix4(), rotation: new THREE.Matrix3() };
let shake = null;

// --- Scalp maths (shared with the app's designer) -------------------------------

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function angularDistance(a, b) {
  let d = Math.abs((a - b) % (2 * Math.PI));
  return d > Math.PI ? 2 * Math.PI - d : d;
}

// 0 where no hair grows (face, below the hairline), 1 on the scalp.
function scalpMultiplier(azimuth, polar) {
  const deg = Math.PI / 180;
  const delta = angularDistance(azimuth, Math.PI / 2);
  const t = smoothstep(0, 60 * deg, delta);
  const hairline = 38 * deg + (75 - 38) * deg * t;
  const vertical = 1 - smoothstep(hairline - 0.14, hairline + 0.14, polar);
  const horizontal = smoothstep(60 * deg - 0.25, 60 * deg + 0.1, delta);
  const lowerHairline = 100 * deg + 24 * deg * smoothstep(80 * deg, 170 * deg, delta);
  const lower = 1 - smoothstep(lowerHairline - 0.08, lowerHairline + 0.04, polar);
  return Math.max(vertical, horizontal) * lower;
}

function collideCpu(p, margin) {
  const local = p.clone().divide(HEAD_SCALE);
  const r = local.length();
  if (r < margin) p.copy(local.multiplyScalar(margin / r).multiply(HEAD_SCALE));
  const torso = p.clone().sub(TORSO_CENTER).divide(TORSO_SCALE);
  const tr = torso.length();
  if (tr < 1.03) p.copy(torso.multiplyScalar(1.03 / tr).multiply(TORSO_SCALE).add(TORSO_CENTER));
}

// --- Guide strands (CPU, once per style) ------------------------------------------

// The comb direction on the scalp at point p: down and away from the crown,
// the top and front swept back, and the hair either side of the part swept
// away from it. Projected onto the scalp so it lies flat.
function combAt(p, style, partSide) {
  const unit = p.clone().divide(HEAD_SCALE).normalize();
  const normal = unit.clone().divide(HEAD_SCALE).normalize();
  const polar = Math.acos(Math.min(1, Math.max(-1, unit.y)));
  const azimuth = Math.atan2(unit.z, unit.x);
  const comb = new THREE.Vector3(Math.cos(polar) * Math.cos(azimuth), -Math.sin(polar), Math.cos(polar) * Math.sin(azimuth));
  const backWeight = style.sweepBack * smoothstep(-0.3, 0.6, unit.z) * smoothstep(0.0, 0.5, unit.y);
  comb.lerp(new THREE.Vector3(0, -0.25, -1), Math.max(-1, Math.min(1, backWeight)));
  if (unit.y > 0.25 && unit.z > -0.5) {
    const nearPart = 1 - smoothstep(0.0, 0.3, Math.abs(unit.x - style.part));
    comb.x += partSide * 1.2 * nearPart;
  }
  return comb.addScaledVector(normal, -comb.dot(normal)).normalize();
}

function generateGuides(count, style) {
  // Area-uniform Fibonacci roots over the scalp cap, kept where hair grows,
  // then a random subset of exactly `count`.
  const candidates = [];
  const total = Math.round(count * 2.2);
  const cap = 1 - Math.cos(MAX_POLAR);
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < total; i++) {
    const polar = Math.acos(1 - ((i + 0.5) / total) * cap);
    const azimuth = ((i * golden) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    if (scalpMultiplier(azimuth, polar) > 0.5) candidates.push({ azimuth, polar });
  }
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  const roots = candidates.slice(0, count);
  const spacing = Math.sqrt((2 * Math.PI * cap * 0.55) / roots.length) * 0.9;

  const rest = new Float32Array(roots.length * V * 4);
  const childOffsets = [];
  roots.forEach(({ azimuth, polar }, row) => {
    const unit = new THREE.Vector3(Math.sin(polar) * Math.cos(azimuth), Math.cos(polar), Math.sin(polar) * Math.sin(azimuth));
    const root = unit.clone().multiply(HEAD_SCALE);
    const normal = unit.clone().divide(HEAD_SCALE).normalize();
    const down = new THREE.Vector3(Math.cos(polar) * Math.cos(azimuth), -Math.sin(polar), Math.cos(polar) * Math.sin(azimuth));

    // Length by region: top (near the crown), sides, back.
    const front = Math.max(0, unit.z);
    const sideness = Math.abs(unit.x);
    const backness = Math.max(0, -unit.z);
    let length = style.top * (1 - smoothstep(0.3, 0.75, polar / MAX_POLAR));
    length += style.sides * smoothstep(0.3, 0.75, polar / MAX_POLAR) * (sideness + front) / Math.max(0.001, sideness + front + backness);
    length += style.back * smoothstep(0.3, 0.75, polar / MAX_POLAR) * backness / Math.max(0.001, sideness + front + backness);
    length *= 0.92 + Math.random() * 0.16;

    // Which side of the part this root is on decides where it's combed to.
    const partSide = Math.sign(unit.x - style.part) || 1;
    const segment = length / (V - 1);
    const dir = normal.clone().multiplyScalar(style.lift).addScaledVector(combAt(root, style, partSide), 1 - style.lift);
    dir.add(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(0.15)).normalize();
    const p = root.clone();
    for (let j = 0; j < V; j++) {
      if (j > 0) {
        // While lying on the head the hair follows the comb; once it leaves
        // the head (or the comb runs downhill), it hangs under gravity.
        const onHead = p.clone().divide(HEAD_SCALE).length() < 1.08;
        const comb = combAt(p, style, partSide);
        if (j > 1 && onHead && comb.y > -0.6) dir.lerp(comb, 0.35);
        else if (j > 1) dir.y -= style.bend * segment;
        dir.normalize();
        p.addScaledVector(dir, segment);
        collideCpu(p, 1.012 + 0.03 * (j / (V - 1)));
        // Re-aim along the surface after a collision.
        if (j > 1) {
          const prev = new THREE.Vector3(rest[(row * V + j - 1) * 4], rest[(row * V + j - 1) * 4 + 1], rest[(row * V + j - 1) * 4 + 2]);
          dir.subVectors(p, prev).normalize();
          p.copy(prev).addScaledVector(dir, segment);
        }
      }
      const o = (row * V + j) * 4;
      rest[o] = p.x;
      rest[o + 1] = p.y;
      rest[o + 2] = p.z;
      rest[o + 3] = 1;
    }

    // Child strands: random spots in the scalp's tangent plane around the
    // guide's root, so together they fill the gaps between guides.
    const tangent = new THREE.Vector3().crossVectors(normal, new THREE.Vector3(0, 1, 0.001)).normalize();
    const bitangent = new THREE.Vector3().crossVectors(normal, tangent);
    for (let c = 0; c < CHILDREN; c++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = c === 0 ? 0 : spacing * Math.sqrt(Math.random());
      const offset = tangent.clone().multiplyScalar(Math.cos(angle) * radius).addScaledVector(bitangent, Math.sin(angle) * radius);
      childOffsets.push(row, Math.random(), 0.86 + Math.random() * 0.14, offset.x, offset.y, offset.z);
    }
  });
  return { rest, rows: roots.length, childOffsets: new Float32Array(childOffsets) };
}

// --- GPU passes ----------------------------------------------------------------

const FULLSCREEN_VERTEX = `void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const COLLIDE_GLSL = `
  uniform mat4 uHead;
  uniform mat4 uHeadInverse;
  const vec3 HEAD_SCALE = vec3(${HEAD_SCALE.x.toFixed(3)}, ${HEAD_SCALE.y.toFixed(3)}, ${HEAD_SCALE.z.toFixed(3)});
  const vec3 TORSO_CENTER = vec3(${TORSO_CENTER.x.toFixed(3)}, ${TORSO_CENTER.y.toFixed(3)}, ${TORSO_CENTER.z.toFixed(3)});
  const vec3 TORSO_SCALE = vec3(${TORSO_SCALE.x.toFixed(3)}, ${TORSO_SCALE.y.toFixed(3)}, ${TORSO_SCALE.z.toFixed(3)});

  vec3 collide(vec3 p, float margin) {
    // Head: ellipsoid in head space (the head can turn and tilt).
    vec3 local = (uHeadInverse * vec4(p, 1.0)).xyz;
    vec3 e = local / HEAD_SCALE;
    float r = length(e);
    if (r < margin) p = (uHead * vec4(e / r * margin * HEAD_SCALE, 1.0)).xyz;
    // Neck: vertical capsule.
    vec2 neck = p.xz - vec2(0.0, -0.05);
    float neckRadius = 0.4;
    if (p.y < -0.55 && p.y > -1.9 && length(neck) < neckRadius) {
      neck = normalize(neck) * neckRadius;
      p.xz = neck + vec2(0.0, -0.05);
    }
    // Shoulders and chest: one ellipsoid.
    vec3 t = (p - TORSO_CENTER) / TORSO_SCALE;
    float tr = length(t);
    if (tr < 1.03) p = TORSO_CENTER + t / tr * 1.03 * TORSO_SCALE;
    return p;
  }
`;

function makePass(fragmentShader, uniforms) {
  return new THREE.ShaderMaterial({ vertexShader: FULLSCREEN_VERTEX, fragmentShader, uniforms, depthTest: false, depthWrite: false });
}

function buildPasses() {
  passes.copy = makePass(
    `uniform sampler2D uSource;
     void main() { gl_FragColor = texelFetch(uSource, ivec2(gl_FragCoord.xy), 0); }`,
    { uSource: { value: null } },
  );

  // Rest positions (V wide) into a state (2V wide): at rest, not moving.
  passes.fillState = makePass(
    `uniform sampler2D uSource;
     void main() { ivec2 c = ivec2(gl_FragCoord.xy); gl_FragColor = texelFetch(uSource, ivec2(c.x % ${V}, c.y), 0); }`,
    { uSource: { value: null } },
  );

  passes.integrate = makePass(
    `uniform sampler2D uState, uRest;
     uniform mat4 uHead;
     uniform float uDt, uDamping, uTime, uWind;
     uniform vec2 uGlobal;
     void main() {
       ivec2 c = ivec2(gl_FragCoord.xy);
       vec3 target = (uHead * vec4(texelFetch(uRest, c, 0).xyz, 1.0)).xyz;
       if (c.x < 2) { gl_FragColor = vec4(target, 1.0); return; }
       vec3 x = texelFetch(uState, c, 0).xyz;
       vec3 xp = texelFetch(uState, ivec2(c.x + ${V}, c.y), 0).xyz;
       float along = float(c.x) / ${(V - 1).toFixed(1)};
       // Gusty wind from front-left, varying across the head and over time.
       float gust = 0.6 + 0.4 * sin(uTime * 1.9 + x.y * 2.1 + x.x * 1.3) * sin(uTime * 0.7 + float(c.y) * 0.017);
       vec3 windForce = normalize(vec3(0.6, 0.15, -1.0)) * uWind * 140.0 * gust * sqrt(along);
       vec3 acceleration = vec3(0.0, ${GRAVITY.toFixed(1)}, 0.0) + windForce;
       vec3 predicted = x + (x - xp) * (1.0 - uDamping) + acceleration * uDt * uDt;
       float rootward = (1.0 - along) * (1.0 - along);
       predicted = mix(predicted, target, mix(uGlobal.y, uGlobal.x, rootward));
       gl_FragColor = vec4(predicted, 1.0);
     }`,
    {
      uState: { value: null }, uRest: { value: null },
      uHead: { value: head.matrix }, uDt: { value: DT }, uDamping: { value: 0.05 },
      uTime: { value: 0 }, uWind: { value: 0 }, uGlobal: { value: new THREE.Vector2() },
    },
  );

  passes.constrain = makePass(
    `uniform sampler2D uPredicted, uRest, uState;
     uniform mat3 uHeadRotation;
     uniform vec2 uLocal;
     uniform float uFriction, uVelocityCorrection;
     ${COLLIDE_GLSL}
     void main() {
       ivec2 c = ivec2(gl_FragCoord.xy);
       bool writesPrevious = c.x >= ${V};
       int i = c.x % ${V};
       vec3 restPrevious = texelFetch(uRest, ivec2(1, c.y), 0).xyz;
       if (i < 2) { gl_FragColor = vec4((uHead * vec4(texelFetch(uRest, ivec2(i, c.y), 0).xyz, 1.0)).xyz, 1.0); return; }
       // Walk out to vertex i, or one further for the previous-position half,
       // which needs the correction applied to the next vertex.
       int last = writesPrevious ? min(i + 1, ${V - 1}) : i;
       vec3 q = (uHead * vec4(restPrevious, 1.0)).xyz;
       vec3 qi = q;
       vec3 nextCorrection = vec3(0.0);
       for (int j = 2; j < ${V}; j++) {
         if (j > last) break;
         vec3 restJ = texelFetch(uRest, ivec2(j, c.y), 0).xyz;
         vec3 restSegment = restJ - restPrevious;
         float segmentLength = length(restSegment);
         vec3 restDirection = uHeadRotation * (restSegment / max(segmentLength, 1e-6));
         vec3 toPredicted = texelFetch(uPredicted, ivec2(j, c.y), 0).xyz - q;
         vec3 direction = length(toPredicted) > 1e-6 ? normalize(toPredicted) : restDirection;
         float along = float(j) / ${(V - 1).toFixed(1)};
         float rootward = (1.0 - along) * (1.0 - along);
         direction = normalize(mix(direction, restDirection, mix(uLocal.y, uLocal.x, rootward)));
         vec3 free = q + direction * segmentLength;
         vec3 collided = collide(free, 1.012 + 0.03 * along);
         // Friction: hair touching the head or shoulders mostly stays put
         // instead of sliding off.
         if (distance(collided, free) > 1e-5) {
           vec3 before = texelFetch(uState, ivec2(j, c.y), 0).xyz;
           collided = collide(mix(collided, before, uFriction), 1.012 + 0.03 * along);
         }
         if (j == i + 1) nextCorrection = collided - texelFetch(uPredicted, ivec2(j, c.y), 0).xyz;
         q = collided;
         if (j == i) qi = q;
         restPrevious = restJ;
       }
       if (!writesPrevious) { gl_FragColor = vec4(qi, 1.0); return; }
       // Velocity correction (Muller et al. 2012): next step's velocity is
       // (qi - previous), i.e. this vertex's move minus a share of the
       // correction the next vertex received.
       vec3 x = texelFetch(uState, ivec2(i, c.y), 0).xyz;
       gl_FragColor = vec4(x + uVelocityCorrection * nextCorrection, 1.0);
     }`,
    {
      uPredicted: { value: null }, uRest: { value: null }, uHead: { value: head.matrix },
      uHeadInverse: { value: head.inverse }, uHeadRotation: { value: head.rotation }, uLocal: { value: new THREE.Vector2() },
      uState: { value: null }, uFriction: { value: 0.5 }, uVelocityCorrection: { value: 0.9 },
    },
  );

  // One fragment per strand: where (as a fraction of its length) the swipe
  // segment A→B crosses it, or 1 if it doesn't. Only hair on the camera's
  // side of the head is cut.
  passes.findCut = makePass(
    `uniform sampler2D uState;
     uniform mat4 uViewProjection;
     uniform vec2 uViewport, uA, uB;
     uniform float uRadius;
     uniform vec3 uCameraDirection;
     float distanceToSegment(vec2 p, vec2 a, vec2 b) {
       vec2 ab = b - a;
       float t = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
       return length(p - a - ab * t);
     }
     void main() {
       int row = int(gl_FragCoord.y);
       float cut = 1.0;
       for (int j = 3; j < ${V}; j++) {
         vec3 p = texelFetch(uState, ivec2(j, row), 0).xyz;
         if (dot(p - vec3(0.0, -0.3, 0.0), uCameraDirection) < -0.35) continue;
         vec4 clip = uViewProjection * vec4(p, 1.0);
         if (clip.w <= 0.0) continue;
         vec2 screen = (clip.xy / clip.w * 0.5 + 0.5) * uViewport;
         if (distanceToSegment(screen, uA, uB) < uRadius) {
           cut = (float(j) - 0.5) / ${(V - 1).toFixed(1)};
           break;
         }
       }
       gl_FragColor = vec4(cut, 0.0, 0.0, 1.0);
     }`,
    {
      uState: { value: null }, uViewProjection: { value: new THREE.Matrix4() }, uViewport: { value: new THREE.Vector2() },
      uA: { value: new THREE.Vector2() }, uB: { value: new THREE.Vector2() }, uRadius: { value: 14 },
      uCameraDirection: { value: new THREE.Vector3() },
    },
  );

  // Shortens cut strands: the kept part keeps its shape, resampled over
  // all V vertices. Works on rest (V wide) and state (2V wide, per half).
  passes.resample = makePass(
    `uniform sampler2D uSource, uCut;
     void main() {
       ivec2 c = ivec2(gl_FragCoord.xy);
       float cut = texelFetch(uCut, ivec2(0, c.y), 0).x;
       if (cut > 0.999) { gl_FragColor = texelFetch(uSource, c, 0); return; }
       int base = (c.x / ${V}) * ${V};
       float s = float(c.x - base) * cut;
       int j0 = int(floor(s));
       int j1 = min(j0 + 1, ${V - 1});
       gl_FragColor = mix(texelFetch(uSource, ivec2(base + j0, c.y), 0), texelFetch(uSource, ivec2(base + j1, c.y), 0), s - float(j0));
     }`,
    { uSource: { value: null }, uCut: { value: null } },
  );
}

function makeTarget(width, height) {
  return new THREE.WebGLRenderTarget(width, height, {
    type: floatTargets ? THREE.FloatType : THREE.HalfFloatType,
    format: THREE.RGBAFormat,
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
    depthBuffer: false,
    stencilBuffer: false,
    generateMipmaps: false,
  });
}

function runPass(material, target) {
  quadMesh.material = material;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, quadCamera);
  renderer.setRenderTarget(null);
}

function copy(source, target) {
  passes.copy.uniforms.uSource.value = source.texture ?? source;
  runPass(passes.copy, target);
}

function fillState(source, target) {
  passes.fillState.uniforms.uSource.value = source.texture ?? source;
  runPass(passes.fillState, target);
}

// --- Style / hair setup ----------------------------------------------------------

function loadStyle() {
  const style = STYLES[styleName];
  const { rest, rows, childOffsets } = generateGuides(guideCount, style);

  for (const target of Object.values(targets)) target.dispose();
  restInitialTexture?.dispose();
  restInitialTexture = new THREE.DataTexture(rest, V, rows, THREE.RGBAFormat, THREE.FloatType);
  restInitialTexture.needsUpdate = true;
  targets = {
    state: makeTarget(2 * V, rows),
    nextState: makeTarget(2 * V, rows),
    stateScratch: makeTarget(2 * V, rows),
    predicted: makeTarget(V, rows),
    rest: makeTarget(V, rows),
    restOriginal: makeTarget(V, rows),
    restScratch: makeTarget(V, rows),
    cut: makeTarget(1, rows),
  };
  head.yaw = head.pitch = head.roll = 0;
  updateHeadMatrix();
  copy(restInitialTexture, targets.rest);
  fillState(restInitialTexture, targets.state);

  passes.integrate.uniforms.uGlobal.value.set(style.global[0], style.global[1]);
  passes.constrain.uniforms.uLocal.value.set(style.local[0], style.local[1]);

  buildHairMesh(rows, childOffsets, style);
  settleFrames = 4; // let it fall into place, then remember that shape
  wake();
}

function buildHairMesh(rows, childOffsets, style) {
  if (hairMesh) {
    scene.remove(hairMesh);
    hairMesh.geometry.dispose();
  }
  const positions = [];
  const indices = [];
  for (let j = 0; j < V; j++) {
    positions.push(-1, j, 0, 1, j, 0);
    if (j < V - 1) indices.push(j * 2, j * 2 + 1, j * 2 + 2, j * 2 + 1, j * 2 + 3, j * 2 + 2);
  }
  const geometry = new THREE.InstancedBufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  const children = new THREE.InstancedInterleavedBuffer(childOffsets, 6, 1);
  geometry.setAttribute('aChild', new THREE.InterleavedBufferAttribute(children, 3, 0));
  geometry.setAttribute('aOffset', new THREE.InterleavedBufferAttribute(children, 3, 3));
  geometry.instanceCount = childOffsets.length / 6;
  hairMaterial.uniforms.uCurl.value = style.curl;
  hairMesh = new THREE.Mesh(geometry, hairMaterial);
  hairMesh.frustumCulled = false;
  scene.add(hairMesh);
}

// --- Hair rendering ------------------------------------------------------------

function buildHairMaterial() {
  hairMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uPositions: { value: null },
      uHeadRotation: { value: head.rotation },
      uColor: { value: new THREE.Color('#4a2f1d') },
      uCurl: { value: 0 },
      uKey: { value: new THREE.Vector3() },
      uRim: { value: new THREE.Vector3() },
    },
    vertexShader: `
      uniform sampler2D uPositions;
      uniform mat3 uHeadRotation;
      uniform float uCurl;
      attribute vec3 aChild;   // guide row, random, tip trim
      attribute vec3 aOffset;  // root offset from the guide, head space
      varying vec3 vTangent;
      varying vec3 vWorld;
      varying float vAlong;
      varying float vShade;

      vec3 guideAt(int row, float s) {
        float k = s * ${(V - 1).toFixed(1)};
        int j0 = int(floor(k));
        int j1 = min(j0 + 1, ${V - 1});
        return mix(texelFetch(uPositions, ivec2(j0, row), 0).xyz, texelFetch(uPositions, ivec2(j1, row), 0).xyz, k - float(j0));
      }

      void main() {
        int row = int(aChild.x);
        float along = position.y / ${(V - 1).toFixed(1)};
        float s = along * aChild.z; // children end at slightly different lengths
        vec3 p = guideAt(row, s);
        float ds = 0.5 / ${(V - 1).toFixed(1)};
        vec3 tangent = normalize(guideAt(row, min(s + ds, 1.0)) - guideAt(row, max(s - ds, 0.0)) + vec3(0.0, -1e-5, 0.0));

        // Children clump toward their guide along the strand.
        p += uHeadRotation * aOffset * mix(1.0, 0.35, smoothstep(0.2, 1.0, along));

        if (uCurl > 0.0) {
          vec3 helper = abs(tangent.y) < 0.95 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
          vec3 b1 = normalize(cross(tangent, helper));
          vec3 b2 = cross(tangent, b1);
          float phase = aChild.y * 6.2832 + along * 34.0;
          float radius = 0.07 * uCurl * smoothstep(0.0, 0.18, along);
          p += radius * (cos(phase) * b1 + sin(phase) * b2);
          tangent = normalize(tangent + radius * 34.0 * (-sin(phase) * b1 + cos(phase) * b2));
        }

        vec3 view = normalize(cameraPosition - p);
        vec3 side = normalize(cross(tangent, view));
        float width = 0.0085 * mix(1.0, 0.25, along);
        p += side * position.x * width;

        vTangent = tangent;
        vWorld = p;
        vAlong = along;
        // Inner children sit deeper in the hair: a little darker.
        vShade = mix(0.72, 1.0, aChild.y) * mix(0.8, 1.0, step(0.001, length(aOffset)));
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      uniform vec3 uKey;
      uniform vec3 uRim;
      varying vec3 vTangent;
      varying vec3 vWorld;
      varying float vAlong;
      varying float vShade;

      // Kajiya-Kay, with a white primary highlight and a coloured secondary
      // one shifted along the strand — the two bands real hair shows.
      float strandSpecular(vec3 t, vec3 h, float power) {
        float th = dot(t, h);
        return pow(sqrt(max(0.0, 1.0 - th * th)), power);
      }

      void main() {
        vec3 t = normalize(vTangent);
        vec3 v = normalize(cameraPosition - vWorld);
        vec3 h = normalize(uKey + v);
        float tl = dot(t, uKey);
        float diffuse = mix(0.35, 1.0, sqrt(max(0.0, 1.0 - tl * tl)));
        float rim = pow(1.0 - abs(dot(t, normalize(uRim))), 6.0) * 0.25;
        float occlusion = mix(0.35, 1.0, smoothstep(0.0, 0.55, vAlong)) * vShade;
        vec3 color = uColor * diffuse * occlusion;
        color += vec3(0.32) * strandSpecular(normalize(t + v * 0.1), h, 90.0) * occlusion;
        color += uColor * 1.6 * strandSpecular(normalize(t - v * 0.15), h, 22.0) * occlusion;
        color += uColor * rim;
        float alpha = 1.0 - smoothstep(0.8, 1.0, vAlong);
        gl_FragColor = vec4(color, alpha);
        #include <colorspace_fragment>
      }`,
    side: THREE.DoubleSide,
    transparent: false,
    alphaToCoverage: true,
  });
}

// --- Scene --------------------------------------------------------------------

function init() {
  const container = document.getElementById('viewport');
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) {
    document.getElementById('stats').textContent = 'This phone has no WebGL2, which the prototype needs.';
    return;
  }
  floatTargets = renderer.extensions.has('EXT_color_buffer_float');
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1714);
  camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.05, 100);
  scene.add(camera);
  scene.add(new THREE.HemisphereLight(0xf2ece2, 0x2a221c, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.8);
  key.position.set(3, 4, 5);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffe6c4, 1.0);
  rim.position.set(-3, 2, -5);
  scene.add(rim);

  // The fullscreen quad every simulation pass draws with.
  quadScene = new THREE.Scene();
  quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quadMesh.frustumCulled = false;
  quadScene.add(quadMesh);

  buildHairMaterial();
  buildBody();
  buildPasses();
  hairMaterial.uniforms.uKey.value.copy(key.position).normalize();
  hairMaterial.uniforms.uRim.value.copy(rim.position).normalize();
  loadStyle();
  setupControls();
  updateCamera();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    wake();
  });
}

function buildBody() {
  const skin = new THREE.MeshStandardMaterial({ color: 0xc68e62, roughness: 0.7 });
  const shirt = new THREE.MeshStandardMaterial({ color: 0x3a3f45, roughness: 0.9 });
  headGroup = new THREE.Group();
  headGroup.matrixAutoUpdate = false;
  scene.add(headGroup);

  // The scalp under the hair takes the hair colour where hair grows (the
  // same hairline maths as the roots), so the gaps between strands read as
  // dense hair rather than bare skin.
  const scalp = skin.clone();
  scalp.onBeforeCompile = (shader) => {
    shader.uniforms.uHairColor = hairMaterial.uniforms.uColor;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vUnit;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvUnit = normalize(position);');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vUnit;
        uniform vec3 uHairColor;
        float angularDistance(float a, float b) { return abs(mod(a - b + PI, PI2) - PI); }
        float scalpCoverage(vec3 u) {
          float polar = acos(clamp(u.y, -1.0, 1.0));
          float delta = angularDistance(atan(u.z, u.x), PI * 0.5);
          float deg = PI / 180.0;
          float t = smoothstep(0.0, 60.0 * deg, delta);
          float hairline = mix(38.0 * deg, 75.0 * deg, t);
          float vertical = 1.0 - smoothstep(hairline - 0.14, hairline + 0.14, polar);
          float horizontal = smoothstep(60.0 * deg - 0.25, 60.0 * deg + 0.1, delta);
          float lowerHairline = 100.0 * deg + 24.0 * deg * smoothstep(80.0 * deg, 170.0 * deg, delta);
          float lower = 1.0 - smoothstep(lowerHairline - 0.08, lowerHairline + 0.04, polar);
          return max(vertical, horizontal) * lower;
        }`)
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, uHairColor * 0.55, smoothstep(0.3, 0.8, scalpCoverage(vUnit)));');
  };
  const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), scalp);
  skull.scale.copy(HEAD_SCALE);
  headGroup.add(skull);
  // Jaw and chin, so the head reads as a head from the side.
  const jaw = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), skin);
  jaw.scale.set(0.62, 0.55, 0.7);
  jaw.position.set(0, -0.55, 0.18);
  headGroup.add(jaw);
  const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1210, roughness: 0.3 });
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMaterial);
    eye.position.set(side * 0.3, 0.02, 0.83);
    headGroup.add(eye);
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), skin);
    ear.position.set(side * 0.86, -0.08, 0.02);
    ear.scale.set(0.35, 0.7, 0.45);
    headGroup.add(ear);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), skin);
  nose.position.set(0, -0.18, 0.9);
  nose.scale.set(0.65, 1, 0.9);
  headGroup.add(nose);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.42, 1.3, 32), skin);
  neck.position.set(0, -1.25, -0.05);
  scene.add(neck);
  const torso = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), shirt);
  torso.scale.copy(TORSO_SCALE);
  torso.position.copy(TORSO_CENTER);
  scene.add(torso);
}

function updateHeadMatrix() {
  const rotation = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(head.pitch, head.yaw, head.roll, 'YXZ'));
  head.matrix.makeTranslation(NECK_PIVOT.x, NECK_PIVOT.y, NECK_PIVOT.z)
    .multiply(rotation)
    .multiply(new THREE.Matrix4().makeTranslation(-NECK_PIVOT.x, -NECK_PIVOT.y, -NECK_PIVOT.z));
  head.inverse.copy(head.matrix).invert();
  head.rotation.setFromMatrix4(head.matrix);
  headGroup.matrix.copy(head.matrix);
  headGroup.matrixWorldNeedsUpdate = true;
}

// --- Simulation step -------------------------------------------------------------

function simulate(steps) {
  for (let i = 0; i < steps; i++) {
    simTime += DT;
    const integrate = passes.integrate.uniforms;
    integrate.uState.value = targets.state.texture;
    integrate.uRest.value = targets.rest.texture;
    integrate.uTime.value = simTime;
    integrate.uWind.value = wind;
    runPass(passes.integrate, targets.predicted);

    const constrain = passes.constrain.uniforms;
    constrain.uPredicted.value = targets.predicted.texture;
    constrain.uRest.value = targets.rest.texture;
    constrain.uState.value = targets.state.texture;
    runPass(passes.constrain, targets.nextState);

    [targets.state, targets.nextState] = [targets.nextState, targets.state];
  }
}

// Applies one swipe segment (CSS pixels, y down) of the scissors.
function cutAlong(a, b) {
  const find = passes.findCut.uniforms;
  find.uState.value = targets.state.texture;
  find.uViewProjection.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  find.uViewport.value.set(window.innerWidth, window.innerHeight);
  find.uA.value.set(a.x, window.innerHeight - a.y);
  find.uB.value.set(b.x, window.innerHeight - b.y);
  find.uCameraDirection.value.copy(camera.position).sub(new THREE.Vector3(0, -0.3, 0)).normalize();
  runPass(passes.findCut, targets.cut);

  for (const [name, scratch] of [['state', 'stateScratch'], ['rest', 'restScratch']]) {
    passes.resample.uniforms.uSource.value = targets[name].texture;
    passes.resample.uniforms.uCut.value = targets.cut.texture;
    runPass(passes.resample, targets[scratch]);
    [targets[name], targets[scratch]] = [targets[scratch], targets[name]];
  }
}

// --- Controls -----------------------------------------------------------------

const orbit = { yaw: 0.35, pitch: 0.12, distance: 9.5, target: new THREE.Vector3(0, -0.75, 0) };
const pointers = new Map();
let pinchDistance = 0;
let lastCutPoint = null;

function setupControls() {
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (event) => {
    try { el.setPointerCapture(event.pointerId); } catch (_) { /* synthetic events in tests */ }
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDistance = Math.hypot(a.x - b.x, a.y - b.y);
      lastCutPoint = null;
    } else if (mode === 'cut') {
      lastCutPoint = { x: event.clientX, y: event.clientY };
    }
    wake();
  });
  el.addEventListener('pointermove', (event) => {
    const pointer = pointers.get(event.pointerId);
    if (!pointer) return;
    const dx = event.clientX - pointer.x;
    const dy = event.clientY - pointer.y;
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    wake();
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const distance = Math.hypot(a.x - b.x, a.y - b.y);
      orbit.distance = Math.min(16, Math.max(3, orbit.distance * (pinchDistance / Math.max(1, distance))));
      pinchDistance = distance;
      updateCamera();
      return;
    }
    if (mode === 'cut' && lastCutPoint) {
      const point = { x: event.clientX, y: event.clientY };
      cutAlong(lastCutPoint, point);
      lastCutPoint = point;
    } else if (mode === 'head') {
      head.yaw = Math.max(-1.0, Math.min(1.0, head.yaw + dx * 0.006));
      head.pitch = Math.max(-0.5, Math.min(0.6, head.pitch + dy * 0.006));
      updateHeadMatrix();
    } else {
      orbit.yaw -= dx * 0.008;
      orbit.pitch = Math.max(-0.6, Math.min(1.3, orbit.pitch + dy * 0.008));
      updateCamera();
    }
  });
  const release = (event) => {
    pointers.delete(event.pointerId);
    lastCutPoint = null;
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('wheel', (event) => {
    event.preventDefault();
    orbit.distance = Math.min(16, Math.max(3, orbit.distance * Math.exp(event.deltaY * 0.001)));
    updateCamera();
    wake();
  }, { passive: false });

  const choose = (groupId, handler) => {
    const group = document.getElementById(groupId);
    group.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      for (const b of group.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b === button));
      handler(button);
    });
  };
  choose('mode', (button) => { mode = button.dataset.mode; });
  choose('style', (button) => { styleName = button.dataset.style; loadStyle(); });
  choose('amount', (button) => { guideCount = Number(button.dataset.amount); loadStyle(); });
  document.getElementById('wind').addEventListener('input', (event) => { wind = Number(event.target.value); wake(); });
  document.getElementById('colour').addEventListener('input', (event) => { hairMaterial.uniforms.uColor.value.set(event.target.value); wake(); });
  document.getElementById('shake').addEventListener('click', () => { shake = { start: performance.now() }; wake(); });
  document.getElementById('regrow').addEventListener('click', () => {
    copy(targets.restOriginal, targets.rest);
    fillState(targets.restOriginal, targets.state);
    head.yaw = head.pitch = 0;
    updateHeadMatrix();
    wake();
  });
}

function updateCamera() {
  camera.position.set(
    orbit.distance * Math.cos(orbit.pitch) * Math.sin(orbit.yaw),
    orbit.distance * Math.sin(orbit.pitch),
    orbit.distance * Math.cos(orbit.pitch) * Math.cos(orbit.yaw),
  ).add(orbit.target);
  camera.lookAt(orbit.target);
  camera.updateMatrixWorld();
}

// --- Loop -------------------------------------------------------------------------
//
// Runs while something moves (touch, wind, shake, hair still settling) and
// stops a few seconds after everything is still, so an idle page costs no
// battery.

let running = false;
let frameCount = 0;
let fpsWindowStart = performance.now();
let fps = 0;

function wake() {
  lastDisturbance = performance.now();
  if (!running) {
    running = true;
    requestAnimationFrame(frame);
  }
}

function frame(now) {
  if (shake) {
    const t = (now - shake.start) / 1000;
    head.yaw = 0.4 * Math.sin(t * Math.PI * 2 * 1.6) * Math.exp(-t * 1.4);
    updateHeadMatrix();
    if (t > 2.2) { shake = null; head.yaw = 0; updateHeadMatrix(); }
    lastDisturbance = now;
  }

  if (settleFrames > 0) {
    simulate(40);
    settleFrames--;
    if (settleFrames === 0) {
      // Remember the settled shape as the style's rest shape. (A V-wide copy
      // of the state takes just its positions half.)
      copy(targets.state, targets.rest);
      copy(targets.state, targets.restOriginal);
      fillState(targets.rest, targets.state);
    }
  } else {
    simulate(SUBSTEPS);
  }

  hairMaterial.uniforms.uPositions.value = targets.state.texture;
  renderer.render(scene, camera);

  frameCount++;
  if (now - fpsWindowStart > 1000) {
    fps = Math.round((frameCount * 1000) / (now - fpsWindowStart));
    frameCount = 0;
    fpsWindowStart = now;
    showStats();
  }

  const idle = wind === 0 && pointers.size === 0 && !shake && settleFrames === 0 && now - lastDisturbance > 3500;
  if (idle) {
    running = false;
    showStats();
    return;
  }
  requestAnimationFrame(frame);
}

function gpuName() {
  const gl = renderer.getContext();
  const info = gl.getExtension('WEBGL_debug_renderer_info');
  return info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'GPU hidden';
}

function showStats() {
  const strands = hairMesh ? hairMesh.geometry.instanceCount : 0;
  document.getElementById('stats').innerHTML =
    `<b>${running ? fps + ' fps' : 'idle'}</b> &middot; ${targets.state.height.toLocaleString()} simulated &middot; ` +
    `${strands.toLocaleString()} drawn<br>${gpuName()} &middot; ${floatTargets ? 'float' : 'half-float'} physics`;
}

init();
</script>
