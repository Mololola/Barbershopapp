# The business website, as a Render Blueprint. Only the website is declared
# here; the API service is managed in the Render dashboard and untouched by
# this file. Create it with New > Blueprint, pointing at this repository.
services:
  - type: web
    runtime: static
    name: barbershopapp-web
    rootDir: mobile
    buildCommand: bash ../tools/web/build.sh
    staticPublishPath: build/web
    buildFilter:
      paths:
        - mobile/**
        - tools/web/**
    envVars:
      - key: SUPABASE_URL
        value: https://qabldsumiuqnzrxyhcot.supabase.co
      # The public (anon/publishable) key, the same one the phone app ships with.
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FASTAPI_BASE_URL
        value: https://barbershopapp-qrpk.onrender.com
    routes:
      # Every page is the one Flutter app, which reads the path itself.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Only this site, Supabase and the API: no third-party scripts can run
      # or receive data, which limits what an injected script could do with
      # the sign-in session the browser holds.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'wasm-unsafe-eval';
          style-src 'self' 'unsafe-inline';
          connect-src 'self' blob: https://qabldsumiuqnzrxyhcot.supabase.co wss://qabldsumiuqnzrxyhcot.supabase.co
          https://barbershopapp-qrpk.onrender.com https://fonts.gstatic.com;
          font-src 'self' data: https://fonts.gstatic.com;
          img-src 'self' data: blob: https:;
          media-src 'self' blob: https://qabldsumiuqnzrxyhcot.supabase.co;
          object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Location for this site only: "Near me" on Find a shop asks for it.
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self)
      # Flutter's files keep their names across releases, so the browser must
      # check for a new version each time instead of running a stale one.
      - path: /*
        name: Cache-Control
        value: no-cache
