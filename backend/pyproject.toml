[project]
name = "barbershop-backend"
version = "0.1.0"
description = "FastAPI service for the Barbershop app: booking engine, reviews, billing, and (later) rankings/finance/ML"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "stripe>=11.1",
    "apscheduler>=3.10",
    "slowapi>=0.1.10",
    "cachetools>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
