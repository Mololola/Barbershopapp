[project]
name = "barbershop-backend"
version = "0.1.0"
description = "FastAPI service for the Barbershop app: booking engine, reviews, billing, and (later) rankings/finance/ML"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[tool.setuptools.packages.find]
include = ["app*"]
